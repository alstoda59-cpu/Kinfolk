name: Kinfolk Installable Alpha (Android and iOS)

on:
  push:
    branches:
      - kinfolk-social/alpha-installable-build
      # Isolated Recovery226 verification; never targets production or store release.
      - kinfolk-social/recovery226-login-remount-cleanup
      # Recovery233 packages the full app against an unreachable CI-only backend.
      - kinfolk-social/recovery233-native-backend-isolation
      # Recovery280: current full-app offline-only Android/iOS compilation; no live credentials.
      - kinfolk-social/recovery280-native-build-and-redirect-safety-20261027
      # Recovery320: refresh offline-only Android APK and iOS Simulator compilation.
      - kinfolk-social/recovery320-native-callback-build-20261029
      # Recovery321: validate native signup callback isolation in fresh Android/iOS packages.
      - kinfolk-social/recovery321-native-signup-redirect-guard-20261029
      # Recovery322: verify native verification resend guards in both offline packages.
      - kinfolk-social/recovery322-native-verification-resend-guard-20261029
      # Recovery323: validate password-reset account/form isolation in both offline packages.
      - kinfolk-social/recovery323-password-reset-form-isolation-20261029
      # Recovery324: verify reset retry ownership and refreshed browser fixtures in offline packages.
      - kinfolk-social/recovery324-password-reset-overlap-ci-20261029
      # Recovery325: compile offline packages with session-isolated account password changes.
      - kinfolk-social/recovery325-password-change-session-guard-20261029
      # Recovery326: compile offline packages with session-isolated blocked-account management.
      - kinfolk-social/recovery326-blocked-account-session-guard-20261029
      # Recovery327: compile offline packages with notification settings session isolation.
      - kinfolk-social/recovery327-notification-settings-session-guard-20261029
      # Recovery329: compile isolated offline packages after native regression suite repair.
      - kinfolk-social/recovery329-native-auth-suite-integrity-20261029
      # Recovery330: verify stale mobile login/signup form isolation in offline native packages.
      - kinfolk-social/recovery330-auth-form-request-isolation-20261029
      # Recovery331: test the effective Phase95 login handler before offline native compilation.
      - kinfolk-social/recovery331-phase95-login-completion-guard-20261029
      # Recovery332: validate unexpected adopted-session cleanup before offline mobile builds.
      - kinfolk-social/recovery332-adopted-session-cleanup-20261029
      # Recovery333: require verified email tokens before adopting mobile auth sessions.
      - kinfolk-social/recovery333-email-confirmed-token-guard-20261029
      # Recovery334: browser login regression must use confirmed synthetic tokens.
      - kinfolk-social/recovery334-browser-confirmed-email-fixture-20261029
      # Recovery335: reject unconfirmed adopted/restored sessions before offline mobile compilation.
      - kinfolk-social/recovery335-adopted-email-confirmation-20261029
      # Recovery336: rerun full offline Android/iOS packaging with corrected confirmed-session browser fixture.
      - kinfolk-social/recovery336-browser-adopted-email-fixture-20261029
      # Recovery337: compile offline mobile packages with confirmed-session preference regression.
      - kinfolk-social/recovery337-auth-preference-confirmed-session-fixture-20261030
      # Recovery338: compile offline packages with startup email confirmation enforced.
      - kinfolk-social/recovery338-startup-confirmed-session-guard-20261030
      # Recovery339: recheck session identity before nonpersistent startup sign-out.
      - kinfolk-social/recovery339-restoration-session-race-20261030
      # Recovery340: rerun offline Android/iOS packages with complete legacy auth-event restoration VM.
      - kinfolk-social/recovery340-auth-event-restore-fixture-20261030
      # Recovery341: re-read even persistent sessions before opening a mobile account.
      - kinfolk-social/recovery341-persistent-restore-freshness-20261030
      # Recovery342: test effective disappearing-DM overlay privacy and send lifecycle.
      - kinfolk-social/recovery342-dm-overlay-isolation-20261030
      # Recovery343: verify group-chat account/modal isolation and duplicate-send safety.
      - kinfolk-social/recovery343-group-chat-session-isolation-20261030
      # Recovery344: verify alpha video MIME and 50 MiB preflight before offline mobile builds.
      - kinfolk-social/recovery344-video-upload-alpha-preflight-20261030
      # Recovery345: validate post/story image MIME and size before offline native builds.
      - kinfolk-social/recovery345-post-story-alpha-media-preflight-20261030
      # Recovery346: guard effective comment replies against stale sessions and duplicate sends.
      - kinfolk-social/recovery346-post-comment-session-isolation-20261030
      # Recovery347: stop destructive account deletion when login, tokens or modal change.
      - kinfolk-social/recovery347-account-deletion-session-guard-20261030
      # Recovery348: verify account-scoped appearance saves in offline native packages.
      - kinfolk-social/recovery348-appearance-session-save-20261030
      # Recovery349: verify authoritative music removal and read-only playback.
      - kinfolk-social/recovery349-profile-music-null-authority-20261030
      # Recovery350: isolate settings hydration and legacy color save across auth activations.
      - kinfolk-social/recovery350-settings-hydration-session-guard-20261030
      # Recovery351: isolate profile playback by auth activation and reject unsafe persisted URLs.
      - kinfolk-social/recovery351-profile-music-url-session-safety-20261030
    paths:
      - 'kinfolk-social/**'
      - '.github/workflows/kinfolk-alpha-native.yml'
  workflow_dispatch:

permissions:
  contents: read

# Synthetic build only until a separately approved test project is available.
# Never point an automated test APK at the shared live Kinfolk backend.
env:
  KINFOLK_ALPHA_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
  KINFOLK_ALPHA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_packaging_only_no_auth
  KINFOLK_ALPHA_PACKAGING_ONLY: '1'

concurrency:
  group: kinfolk-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Android installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest already includes Android command-line tools and ANDROID_HOME.
      # android-actions/setup-android@v3 attempts to install removed 'tools' package.
      - name: Install Android 35 build packages using hosted SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Resolve pinned native dependencies and install
        working-directory: kinfolk-social/native
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
          npm ci --no-audit --no-fund
      - name: Prepare and validate full Kinfolk native bundle
        working-directory: kinfolk-social/native
        run: |
          npm run prepare:web
          npm run alpha:verify
      - name: Identify isolated private alpha app
        working-directory: kinfolk-social/native
        run: |
          node --input-type=module -e "import fs from 'node:fs';let p='capacitor.config.json',j=JSON.parse(fs.readFileSync(p));j.appId='social.kinfolk.alpha';j.appName='Kinfolk Social Alpha';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
      - name: Generate Android project and sync local app assets
        working-directory: kinfolk-social/native
        run: |
          npx cap add android
          npx cap sync android
      - name: Compile installable debug APK (no release signing)
        working-directory: kinfolk-social/native/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publish private-test Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinfolk-social-android-alpha-offline-package
          path: kinfolk-social/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    name: iOS unsigned simulator app (not an iPhone IPA)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned native dependencies and install
        working-directory: kinfolk-social/native
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
          npm ci --no-audit --no-fund
      - name: Prepare and validate full Kinfolk native bundle
        working-directory: kinfolk-social/native
        run: |
          npm run prepare:web
          npm run alpha:verify
      - name: Identify isolated private alpha app
        working-directory: kinfolk-social/native
        run: |
          node --input-type=module -e "import fs from 'node:fs';let p='capacitor.config.json',j=JSON.parse(fs.readFileSync(p));j.appId='social.kinfolk.alpha';j.appName='Kinfolk Social Alpha';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
      - name: Generate iOS project and sync local app assets
        working-directory: kinfolk-social/native
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Compile unsigned iOS Simulator application
        working-directory: kinfolk-social/native
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/KinfolkAlphaDerived" CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/KinfolkAlphaDerived/Build/Products/Debug-iphonesimulator/App.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/KinfolkAlphaDerived/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/kinfolk-ios-simulator.zip"
      - name: Publish iOS Simulator zip (not installable on physical iPhone)
        uses: actions/upload-artifact@v4
        with:
          name: kinfolk-social-ios-alpha-offline-package
          path: ${{ runner.temp }}/kinfolk-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
