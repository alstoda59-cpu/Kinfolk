name: Kinfolk Recovery174 regression
on:
  push:
    branches:
      - kinfolk-social/recovery174-rating-modal-guard
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rating-modal-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check kinfolk-social/kinfolk-phase82.js
          node --check kinfolk-social/tests/recovery174-rating-modal-guard.test.cjs
      - name: Account-switch regression
        run: node kinfolk-social/tests/recovery174-rating-modal-guard.test.cjs
