name: Kinfolk Recovery182 login session identity
on:
  push:
    branches:
      - kinfolk-social/recovery182-login-session-identity
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check auth source and test syntax
        run: |
          node --check kinfolk-social/kinfolk-phase95.js
          node --check kinfolk-social/kinfolk-phase79.js
          node --check kinfolk-social/tests/recovery182-login-session-identity.test.cjs
      - name: Verify offline auth regressions
        run: |
          node --test kinfolk-social/tests/recovery179-signup-session-tab.test.cjs kinfolk-social/tests/recovery180-signup-storage-atomic.test.cjs kinfolk-social/tests/recovery181-signup-account-switch.test.cjs kinfolk-social/tests/recovery182-login-session-identity.test.cjs
