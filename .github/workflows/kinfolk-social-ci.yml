name: Kinfolk Social source checks

# Keep one active CI run per development branch; successive fixes supersede old runs.
concurrency:
  group: kinfolk-social-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - 'kinfolk-social/**'
    paths:
      - 'kinfolk-social/**'
      - '.github/workflows/kinfolk-social-ci.yml'
  pull_request:
    paths:
      - 'kinfolk-social/**'
      - '.github/workflows/kinfolk-social-ci.yml'
jobs:
  syntax-and-package:
    runs-on: ubuntu-latest
    # Packaging-only placeholder. Never connects to the live Supabase project.
    env:
      KINFOLK_ALPHA_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
      KINFOLK_ALPHA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_packaging_only_no_auth
      KINFOLK_ALPHA_PACKAGING_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare alpha native dependencies for existing packaging regressions
        working-directory: kinfolk-social/native
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
          npm ci --no-audit --no-fund
      - name: Complete Node regression suite (synthetic only)
        run: node --test kinfolk-social/tests/*.test.cjs kinfolk-social/tests/*.test.mjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Simulated browser regressions (no live Supabase)
        working-directory: kinfolk-social
        run: |
          python test_recovery129.py
          python test_recovery133.py
          python test_recovery137.py
          python test_recovery138.py
          python test_recovery139.py
          python test_recovery141.py
          python test_recovery143.py
          python test_recovery218.py
          python test_recovery219.py
          python test_recovery221.py
          python test_recovery222.py
          python test_recovery223.py
          python test_recovery224.py
          python test_recovery225.py
          python test_recovery317.py
      - name: Offline reaction regression (no live Supabase)
        run: node kinfolk-social/test_recovery148_reactions.js
      - name: Offline session restoration regression (no live Supabase)
        run: node kinfolk-social/test_recovery149_session_retry.js
      - name: Auth event and login preference regressions (synthetic only)
        run: |
          node kinfolk-social/test_recovery150_auth_event.js
          node kinfolk-social/test_recovery151_auth_preference.js
      - name: Incomplete login local-session cleanup (synthetic only)
        run: node --test kinfolk-social/tests/recovery214-failed-login-cleanup.test.cjs
      - name: Login preference storage regressions (synthetic only)
        run: |
          node kinfolk-social/test_recovery152_storage.js
          node kinfolk-social/test_recovery153_rollback.js
      - name: Login adoption rollback regression (synthetic only)
        run: node kinfolk-social/test_recovery154_adoption_rollback.js
      - name: Profile music regression (synthetic only)
        run: node kinfolk-social/test_recovery155_profile_music.js
      - name: Reels and Channels reaction regression (synthetic only)
        run: node kinfolk-social/test_recovery156_video_reactions.js
      - name: Share and remix regression (static only)
        run: node kinfolk-social/test_recovery157_share_remix.js
      - name: Video actions renderer regression (static only)
        run: node kinfolk-social/test_recovery158_video_actions.js
      - name: Immersive Reels regression (synthetic only)
        run: node kinfolk-social/test_recovery159_immersive_reels.js
      - name: Reels playback lifecycle regression (synthetic only)
        run: node kinfolk-social/test_recovery160_reels_lifecycle.js
      - name: Reels controls regression (synthetic only)
        run: node kinfolk-social/test_recovery161_reels_controls.js
      - name: Reels visibility regression
        run: node kinfolk-social/test_recovery162_reels_visibility.js
      - name: Reels foreground playback regression
        run: node kinfolk-social/test_recovery163_foreground.js
      - name: Reels observer regression
        run: node kinfolk-social/test_recovery164_observer.js
      - name: Reels saved and reaction state regression
        run: node kinfolk-social/test_recovery165_reels_state.js
      - name: Reels reaction pending-state regression
        run: node kinfolk-social/test_recovery166_reaction_guard.js
      - name: Video reaction request lock regression
        run: node kinfolk-social/test_recovery167_reaction_lock.js
      - name: Reels async render cancellation regression
        run: node kinfolk-social/test_recovery168_render_cancel.js
      - name: Reels scroll fallback regression
        run: node kinfolk-social/test_recovery169_scroll_fallback.js
      - name: Reels media event regression
        run: node kinfolk-social/test_recovery170_media_events.js
      - name: Reels playback eligibility regression
        run: node kinfolk-social/test_recovery171_playback_safety.js
      - name: Reels manual pause regression
        run: node kinfolk-social/test_recovery172_manual_pause.js
      - name: Android and iOS Shorts viewport regressions (synthetic mobile only)
        run: |
          node --test kinfolk-social/tests/recovery195-shorts-mobile-layout.test.cjs kinfolk-social/tests/recovery199-mobile-viewport.test.cjs kinfolk-social/tests/recovery201-mobile-release-guards.test.cjs kinfolk-social/tests/recovery204-reels-input-safety.test.cjs
      - name: Signup session verification and storage rollback regressions (synthetic only)
        run: node --test kinfolk-social/tests/recovery179-signup-session-tab.test.cjs kinfolk-social/tests/recovery180-signup-storage-atomic.test.cjs kinfolk-social/tests/recovery181-signup-account-switch.test.cjs kinfolk-social/tests/recovery205-signup-session-guard.test.cjs
      - name: Login to signup mode-toggle regression (synthetic DOM only)
        run: node --test kinfolk-social/tests/recovery212-auth-mode-toggle.test.cjs
      - name: Signup navigation race regression (static only)
        run: node --test kinfolk-social/tests/recovery207-signup-navigation-guard.test.cjs kinfolk-social/tests/recovery211-signup-success-navigation.test.cjs
      - name: Login async account navigation guard (static only)
        run: node --test kinfolk-social/tests/recovery215-login-navigation-check.test.cjs kinfolk-social/tests/recovery216-navigation.test.cjs
      - name: Signup identity and confirmation field checks (static only)
        run: node --test kinfolk-social/tests/recovery217-signup-fields.test.cjs
      - name: Signup backend metadata and migration draft checks (static only)
        run: node --test kinfolk-social/tests/recovery219-signup-backend-alignment.test.cjs
      - name: Signup async navigation regressions (synthetic only)
        run: node --test kinfolk-social/tests/recovery213-signup-async-navigation.test.cjs
      - name: Account-isolated content lane regression (synthetic only)
        run: node kinfolk-social/test_recovery173_content_isolation.js
      - name: JavaScript syntax
        run: |
          for f in kinfolk-social/kinfolk-*.js kinfolk-social/service-worker.js; do node --check "$f"; done
      - name: Native script detection regression
        run: node kinfolk-social/test_native_script_detection.js
      - name: Prepare local native web assets
        working-directory: kinfolk-social/native
        run: npm run prepare:web
      - name: Verify isolated native package and all preserved app modules
        working-directory: kinfolk-social/native
        run: npm run alpha:verify
