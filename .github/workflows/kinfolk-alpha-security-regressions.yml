name: Kinfolk alpha auth and preview isolation regressions
# Run on every Recovery branch push, not only selected file paths:
# authentication/security behavior may change in other app modules.
on:
  push:
    branches:
      - 'kinfolk-social/recovery*'
  pull_request:
    paths:
      - 'kinfolk-social/**'
      - '.github/workflows/kinfolk-alpha-security-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security:
    name: Synthetic auth and preview isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify functional alpha backend and two-user RLS gates (offline synthetic fixtures)
        run: |
          node --test kinfolk-social/native/tests/alpha-functional-backend-gate.test.mjs kinfolk-social/native/tests/alpha-functional-rls-gate.test.mjs kinfolk-social/native/tests/alpha-two-user-rls.test.mjs kinfolk-social/native/tests/alpha-auth-reachability.test.mjs kinfolk-social/native/tests/alpha-auth-signup-readiness.test.mjs
      - name: Verify native Capacitor isolation, startup and email callbacks
        run: |
          node --test kinfolk-social/native/tests/alpha-local-capacitor-config.test.mjs kinfolk-social/native/tests/alpha-backend-config.test.mjs kinfolk-social/native/tests/alpha-startup-scripts.test.mjs kinfolk-social/native/tests/alpha-email-callback.test.mjs
      - name: Verify confirmed session behavior
        run: node kinfolk-social/tests/recovery442-confirmed-session.test.cjs
      - name: Verify email confirmation and auth restoration races
        run: |
          node kinfolk-social/tests/recovery360-signup-email-confirmation.test.mjs
          node kinfolk-social/tests/recovery339-restoration-session-race.test.mjs
          node kinfolk-social/tests/recovery456-unconfirmed-token-isolation.test.cjs
      - name: Verify account-isolated posting, messaging and media
        run: |
          node kinfolk-social/tests/recovery458-comment-account-isolation.test.cjs
          node kinfolk-social/tests/recovery464-dm-write-ack.test.cjs
          node kinfolk-social/tests/recovery466-album-add-photo-isolation.test.cjs
          node kinfolk-social/tests/recovery467-channel-subscribe-isolation.test.cjs
      - name: Verify executable preview transport guard
        run: node kinfolk-social/tests/recovery468-preview-isolation-runtime.test.cjs
      - name: Verify Vercel preview backend isolation
        run: node kinfolk-social/tests/recovery444-preview-isolation.test.cjs

  native-package-offline:
    name: Package complete native web assets and run alpha verification (offline only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kinfolk-social/native
    env:
      KINFOLK_ALPHA_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
      KINFOLK_ALPHA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_packaging_only_no_auth
      KINFOLK_ALPHA_PACKAGING_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kinfolk-social/native/package-lock.json
      - name: Install locked native dependencies
        run: npm ci --ignore-scripts
      - name: Build isolated native web assets (no real backend)
        run: npm run prepare:web
      - name: Verify complete native package and feature regressions
        run: npm run alpha:verify
      - name: Record offline native asset integrity and CI-only marker
        run: |
          test "$KINFOLK_ALPHA_PACKAGING_ONLY" = "1"
          test -f www/index.html
          test -f www/kinfolk-supabase-sdk.js
          if grep -R -l 'zojajuzmfjpvubzibzgg' www --include='*.js' --include='*.html'; then
            echo "Live backend reference leaked into native assets" >&2
            exit 1
          fi
          mkdir -p evidence
          find www -type f -print0 | sort -z | xargs -0 sha256sum > evidence/offline-native-assets.sha256
          printf 'OFFLINE PACKAGING ONLY: backend unreachable; authentication, media, messaging and RLS NOT tested.\n' > evidence/NOT_FUNCTIONAL_ALPHA.txt
      - name: Upload isolated native web assets for reproducible packaging review
        uses: actions/upload-artifact@v4
        with:
          name: kinfolk-native-web-assets-OFFLINE-NOT-FUNCTIONAL
          path: |
            kinfolk-social/native/www/
            kinfolk-social/native/evidence/
          retention-days: 3
          if-no-files-found: error

  android-debug-offline:
    name: Compile installable Android debug APK (offline stub, NOT functional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kinfolk-social/native
    env:
      KINFOLK_ALPHA_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
      KINFOLK_ALPHA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_packaging_only_no_auth
      KINFOLK_ALPHA_PACKAGING_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kinfolk-social/native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Hosted Ubuntu already provides Android command-line tools. The old setup action
      # fails while requesting a removed legacy SDK 'tools' package.
      - name: Install Android 35 packages using hosted SDK
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Run compiled APK audit regressions before Gradle compilation
        run: python3 -m unittest discover -s scripts -p 'test_audit_compiled_apk.py' -v
      - name: Verify Gradle retry does not mask compilation failures
        run: python3 -m unittest discover -s scripts -p 'test_gradle_retry_guard.py' -v
      - name: Install locked Capacitor dependencies
        run: npm ci --ignore-scripts
      - name: Build and verify isolated complete web app
        run: |
          npm run prepare:web
          npm run alpha:verify
      - name: Generate temporary Android native project and sync web assets
        run: |
          npm run android:init
          npx cap sync android
      - name: Compile Android debug APK (not signed for release)
        run: |
          cd android
          chmod +x gradlew
          # Capacitor generates a Gradle wrapper with a 10-second distribution download timeout.
          # Hosted runner network variance can exceed that even when the build is healthy.
          printf '\nnetworkTimeout=120000\n' >> gradle/wrapper/gradle-wrapper.properties
          # Retry only transient Gradle distribution transport failures (e.g. HTTP 504).
          # Gradle also prints a generic FAILURE header for network errors; only task/compiler failures are terminal.
          for attempt in 1 2 3; do
            set +e
            ./gradlew --no-daemon assembleDebug 2>&1 | tee /tmp/kinfolk-gradle-build.log
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then break; fi
            if [ "$attempt" -eq 3 ] || grep -Eq '^> Task .* FAILED|^.*Compilation failed|^Execution failed for task /tmp/kinfolk-gradle-build.log || ! grep -Eq 'Server returned HTTP response code: (429|500|502|503|504)|SocketTimeoutException|Read timed out|Connect timed out' /tmp/kinfolk-gradle-build.log; then
              exit "$result"
            fi
            echo "Transient Gradle distribution transport failure; retrying attempt $((attempt + 1))/3"
            sleep $((attempt * 15))
          done
      - name: Audit compiled APK embedded app and offline backend isolation
        run: python3 scripts/audit-compiled-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify debug APK and label nonfunctional backend
        run: |
          test "$KINFOLK_ALPHA_PACKAGING_ONLY" = "1"
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p evidence
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > evidence/android-debug-apk.sha256
          printf 'OFFLINE CI BACKEND: APK is installable for UI/navigation tests only. Signup, login, media, messaging, RLS, and email verification cannot work. Not for distribution. App ID is unconfirmed.\n' > evidence/NOT_FUNCTIONAL_ANDROID_ALPHA.txt
      - name: Upload offline Android debug APK with warning and checksum
        uses: actions/upload-artifact@v4
        with:
          name: kinfolk-android-debug-OFFLINE-NOT-FUNCTIONAL
          path: |
            kinfolk-social/native/android/app/build/outputs/apk/debug/app-debug.apk
            kinfolk-social/native/evidence/android-debug-apk.sha256
            kinfolk-social/native/evidence/NOT_FUNCTIONAL_ANDROID_ALPHA.txt
          retention-days: 3
          if-no-files-found: error
