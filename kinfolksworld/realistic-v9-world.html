<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#090b11" />
<title>Kinfolksworld Room Life Multiplayer</title>
<style>
:root{color-scheme:dark;--bg:#090b11;--panel:rgba(9,11,17,.8);--line:rgba(255,255,255,.11);--muted:#aab0c2;--accent:#8a63ff;--accent2:#5c8dff;--good:#49e5a7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff}button,input{font:inherit}button{cursor:pointer}#baseApp{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}#mpLauncher{position:fixed;right:14px;top:74px;z-index:40;border:1px solid var(--line);background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border-radius:16px;padding:11px 14px;font-weight:900;box-shadow:0 12px 30px rgba(80,70,180,.35)}#mpLauncher span{opacity:.8;font-size:11px;display:block;margin-top:2px;font-weight:700}#mpLayer{position:fixed;inset:0;z-index:60;background:#090b11;display:none}#mpLayer.open{display:block}#mpCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.mpHud{position:absolute;inset:0;pointer-events:none}.mpTop{pointer-events:auto;position:absolute;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.mpPill,.glass{background:var(--panel);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.24)}.mpPill{border-radius:16px;padding:10px 12px;max-width:min(55vw,480px)}.roomName{font-weight:900;font-size:15px}.roomMeta{font-size:10px;color:#b9bdd0;margin-top:2px}.musicMeta{font-size:9px;color:#d4caff;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.liveDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);margin-right:5px}.topActions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.topActions button,.actionBar button,.movePad button,.interactBtn{border:1px solid var(--line);color:white;background:var(--panel);font-weight:900}.topActions button{border-radius:14px;padding:10px 11px}.topActions button:disabled{opacity:.45}.roster{position:absolute;right:10px;top:78px;width:min(190px,46vw);max-height:31vh;overflow:auto;background:var(--panel);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;padding:9px;pointer-events:auto}.rosterTitle{font-size:10px;font-weight:900;letter-spacing:.12em;color:#b7a6ff;margin:2px 4px 7px}.person{display:flex;align-items:center;gap:8px;padding:7px;border-radius:12px}.personDot{width:30px;height:30px;border-radius:11px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#8a63ff,#ff5ba7)}.personName{font-size:11px;font-weight:850}.personState{font-size:9px;color:#9fa5b8;margin-top:1px}.chat{position:absolute;right:10px;bottom:calc(16px + env(safe-area-inset-bottom));width:min(330px,48vw);height:min(42vh,360px);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;overflow:hidden;pointer-events:auto}.chatHead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:900}.chatHead button{border:0;background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:6px 8px}.chatLog{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.msg{font-size:11px;line-height:1.32}.msg b{color:#d4caff}.msg small{color:#7f879b;margin-left:5px}.systemMsg{font-size:10px;color:#8f97aa;text-align:center}.chatForm{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}.chatForm input{flex:1;min-width:0;border:1px solid var(--line);background:#111520;color:white;border-radius:12px;padding:10px 11px;outline:none}.chatForm button{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:12px;padding:9px 12px;font-weight:900}.actionBar{pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:7px;padding:7px;border-radius:18px;background:var(--panel);backdrop-filter:blur(18px);border:1px solid var(--line)}.actionBar button{border-radius:12px;padding:8px 10px;font-size:11px}.actionBar button.active{background:linear-gradient(135deg,var(--accent),var(--accent2))}.movePad{pointer-events:auto;position:absolute;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:132px;height:132px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:5px}.movePad button{border-radius:16px;font-size:19px;background:rgba(17,20,31,.72);backdrop-filter:blur(16px)}.movePad .up{grid-column:2;grid-row:1}.movePad .left{grid-column:1;grid-row:2}.movePad .down{grid-column:2;grid-row:3}.movePad .right{grid-column:3;grid-row:2}.interactBtn{pointer-events:auto;position:absolute;left:160px;bottom:calc(28px + env(safe-area-inset-bottom));border-radius:15px;padding:10px 13px;display:none;background:linear-gradient(135deg,#ff5ba7,#8a63ff)}.interactBtn.show{display:block}.drawerBack{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(7px);display:none;pointer-events:auto}.drawerBack.open{display:block}.drawer{position:absolute;left:0;top:0;bottom:0;width:min(380px,88vw);padding:max(18px,env(safe-area-inset-top)) 14px 18px;background:#121620;border-right:1px solid var(--line);overflow:auto}.drawerHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.drawerHead h2{margin:0;font-size:22px}.drawerHead button{border:0;background:rgba(255,255,255,.07);color:#fff;border-radius:12px;width:36px;height:36px}.roomCard{width:100%;text-align:left;border:1px solid var(--line);color:#fff;background:linear-gradient(145deg,#1b2030,#12151e);border-radius:18px;padding:14px;margin:8px 0}.roomCard.active{outline:2px solid #8a63ff}.roomCard b{display:block;font-size:14px}.roomCard small{display:block;color:var(--muted);margin-top:4px}.drawerAction{width:100%;border:0;color:white;background:linear-gradient(135deg,#8a63ff,#5c8dff);border-radius:14px;padding:12px;font-weight:900;margin-top:10px}.saveState{font-size:10px;color:var(--muted);margin-top:8px;text-align:center}.statusToast{position:absolute;left:50%;top:94px;transform:translate(-50%,-8px);opacity:0;background:#f6f5fb;color:#11131a;padding:9px 12px;border-radius:999px;font-size:11px;font-weight:900;transition:.2s;pointer-events:none;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.statusToast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.roster{display:none}.chat{left:10px;right:10px;bottom:calc(154px + env(safe-area-inset-bottom));width:auto;height:180px}.chat.collapsed{height:42px}.chat.collapsed .chatLog,.chat.collapsed .chatForm{display:none}.actionBar{left:auto;right:10px;transform:none;bottom:calc(88px + env(safe-area-inset-bottom));max-width:calc(100% - 166px);overflow:auto}.topActions .hideMobile{display:none}.interactBtn{left:160px;bottom:calc(30px + env(safe-area-inset-bottom))}.mpPill{max-width:50vw}.topActions button{padding:9px 9px;font-size:11px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<iframe id="baseApp" src="./realistic-v4.html" title="Kinfolksworld"></iframe>
<button id="mpLauncher">🌐 Enter Multiplayer<span>Room life + music beta</span></button>
<section id="mpLayer"><div id="mpCanvas"></div><div class="mpHud">
<div class="mpTop"><div class="mpPill"><div class="roomName" id="mpRoomName">Skyline Lounge</div><div class="roomMeta"><span class="liveDot"></span><span id="mpStatus">Connecting…</span></div><div class="musicMeta" id="musicMeta">No room music</div></div><div class="topActions"><button id="roomButton">Rooms</button><button id="musicButton" disabled>Music</button><button id="shareRoom" class="hideMobile">Invite</button><button id="saveAvatar" class="hideMobile">Save avatar</button><button id="mpExit">Exit</button></div></div>
<div class="roster"><div class="rosterTitle">PLAYERS HERE</div><div id="mpRoster"></div></div>
<div class="chat" id="chatPanel"><div class="chatHead"><span>ROOM CHAT</span><button id="chatToggle">−</button></div><div class="chatLog" id="chatLog"></div><form class="chatForm" id="chatForm"><input id="chatInput" maxlength="180" autocomplete="off" placeholder="Say something…" /><button>Send</button></form></div>
<div class="actionBar" id="mpActions"><button data-action="idle" class="active">Idle</button><button data-action="wave">Wave</button><button data-action="dance">Dance</button><button data-action="sit">Sit</button></div>
<div class="movePad" id="movePad"><button class="up" data-move="forward">▲</button><button class="left" data-move="left">◀</button><button class="right" data-move="right">▶</button><button class="down" data-move="back">▼</button></div>
<button class="interactBtn" id="interactBtn">Use</button>
<div class="drawerBack" id="drawerBack"><aside class="drawer"><div class="drawerHead"><h2>Worlds</h2><button id="drawerClose">×</button></div><div id="roomList"></div><button class="drawerAction" id="drawerSaveAvatar">Save my avatar</button><div class="saveState" id="saveState"></div></aside></div>
<div class="statusToast" id="mpToast"></div>
</div></section>
<script type="module" src="./multiplayer-v9.js"></script>
</body></html>
