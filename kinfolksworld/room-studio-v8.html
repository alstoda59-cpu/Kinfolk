<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kinfolksworld Room Studio</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#090b11;overflow:hidden}iframe{display:block}</style></head><body><iframe id="studioInner" src="./room-studio-v7.html" title="Kinfolksworld Room Studio"></iframe><script>const f=document.getElementById('studioInner');function notify(){try{parent.postMessage({type:'kinfolksworld-layout-saved',at:Date.now()},'*')}catch{}}function notifyAfterSave(){setTimeout(notify,750);setTimeout(notify,1900)}f.addEventListener('load',()=>{let d;try{d=f.contentDocument}catch{return}for(const id of ['saveLayout','saveSettings','clearLayout','createRoom'])d.getElementById(id)?.addEventListener('click',notifyAfterSave);const back=d.getElementById('backWorld');if(back)back.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();notify();parent.postMessage('kinfolksworld-close-studio','*')},{capture:true});});</script></body></html>
