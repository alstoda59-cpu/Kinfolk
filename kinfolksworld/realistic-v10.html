<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b11"><title>Kinfolksworld</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b11;font-family:Inter,system-ui,sans-serif}iframe{width:100%;height:100%;border:0;display:block}.studioBtn{position:fixed;z-index:80;left:14px;top:74px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(135deg,#ff5ba7,#8a63ff);color:#fff;border-radius:16px;padding:11px 14px;font-weight:900;box-shadow:0 12px 30px rgba(80,70,180,.35);cursor:pointer}.studioBtn span{display:block;font-size:10px;opacity:.82;margin-top:2px}.studio{position:fixed;inset:0;z-index:100;display:none;background:#090b11}.studio.open{display:block}.closeStudio{position:absolute;right:14px;top:max(12px,env(safe-area-inset-top));z-index:120;border:1px solid rgba(255,255,255,.12);background:rgba(9,11,17,.82);backdrop-filter:blur(16px);color:white;border-radius:14px;padding:9px 12px;font-weight:900;cursor:pointer}</style></head><body><iframe id="worldFrame" src="./realistic-v10-world.html" title="Kinfolksworld multiplayer"></iframe><button class="studioBtn" id="openStudio">🛋️ Room Studio<span>Build, upload music & manage rooms</span></button><section class="studio" id="studio"><button class="closeStudio" id="closeStudio">Close Studio</button><iframe id="studioFrame" src="./room-studio-v10.html" title="Kinfolksworld Room Studio"></iframe></section><script>const s=document.getElementById('studio'),w=document.getElementById('worldFrame');function refreshWorld(){try{w.contentWindow.postMessage({type:'kinfolksworld-refresh-furniture'},'*')}catch{}}document.getElementById('openStudio').onclick=()=>s.classList.add('open');document.getElementById('closeStudio').onclick=()=>{s.classList.remove('open');refreshWorld()};window.addEventListener('message',e=>{if(e.data==='kinfolksworld-close-studio'){s.classList.remove('open');refreshWorld()}if(e.data?.type==='kinfolksworld-layout-saved')refreshWorld()});</script></body></html>
